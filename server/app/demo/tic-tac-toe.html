<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tic-Tac-Toe — Demo Client</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; background: #121214; color: #e8e8e8; }
  .panel { background: #1e2230; border: 1px solid #2f3a5a; color: #d6e0ff; padding: .75rem 1rem; border-radius: 8px; font-size: .9rem; }
  .panel code { background: #121214; color: #e8e8e8; padding: 0 .25rem; border-radius: 4px; }
  #board { display: grid; grid-template-columns: repeat(3, 96px); gap: 6px; margin: 1rem 0; }
  .cell { width: 96px; height: 96px; font-size: 2.5rem; cursor: pointer; border: 1px solid #444; border-radius: 8px; background: #1e1e22; color: #fff; }
  .cell:disabled { cursor: default; background: #17171a; color: #ddd; }
  #status { font-weight: 600; margin: .5rem 0; }
  #log { white-space: pre-wrap; background: #0a0a0a; color: #d6ffd6; padding: .75rem; border-radius: 8px; font-size: .8rem; max-height: 220px; overflow: auto; }
  input, button { padding: .5rem .75rem; font-size: 1rem; margin: .25rem 0; background: #1e1e22; color: #e8e8e8; border: 1px solid #444; border-radius: 6px; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<h1>Tic-Tac-Toe — demo client</h1>
<p class="panel">
  Rules live here. The server enforces turns. State arrives on the SSE
  stream as one <code>mp</code> signal.
</p>
<div>
  <label>Name <input id="name" value="player" /></label>
  <label>Skill (client-reported) <input id="skill" type="number" value="1000" /></label>
  <button id="joinBtn">Join matchmaking</button>
  <button id="leaveBtn" disabled>Leave</button>
  <button id="rematchBtn" disabled>Rematch</button>
</div>
<div id="status">Not joined.</div>
<div id="you"></div>
<div id="board"></div>
<div>
  <button id="passBtn" disabled>Pass</button>
  <button id="resignBtn" disabled>Resign</button>
</div>
<h3>Log</h3>
<pre id="log"></pre>
<script>
// Tic-tac-toe rules.
const WIN_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const winnerOf = (b) => { for (const [a,c,d] of WIN_LINES) if (b[a] && b[a]===b[c] && b[a]===b[d]) return b[a]; return null; };
let clientId = null, sessionId = null, roomId = null;
let turnOrder = [], myMark = null, board = Array(9).fill("");
let stream = null;
const $ = (id) => document.getElementById(id);
const log = (msg) => { $("log").textContent += msg + "\n"; $("log").scrollTop = 1e9; };
const api = (path, opts={}) => fetch(path, {
  ...opts,
  headers: { "Content-Type": "application/json", ...(clientId ? { "X-Client-ID": clientId } : {}), ...(opts.headers||{}) },
});
function render() {
  const el = $("board"); el.innerHTML = "";
  board.forEach((v, i) => {
    const b = document.createElement("button");
    b.className = "cell"; b.textContent = v || ""; b.disabled = !!v;
    b.onclick = () => makeMove(i);
    el.appendChild(b);
  });
}
async function join() {
  const name = $("name").value || "player";
  const skill = Number($("skill").value || 1000);
  const res = await api("/api/multiplayer/join", { method: "POST", body: JSON.stringify({
    environment_name: "tic-tac-toe-demo",
    character_name: name,
    game_id: "tic-tac-toe-demo",
    player_id: "demo-" + name.toLowerCase().replace(/\W+/g, "-") + "-" + Math.random().toString(36).slice(2, 6),
    display_name: name,
    skill: { rating: skill },
    config: {
      game_id: "tic-tac-toe-demo",
      requires_matchmaking: true,
      requires_turn_based: true,
      max_players_per_room: 2,
      min_players_per_room: 2,
      matchmaking: { game_mode: "default" },
      turn: { allow_pass: true, allow_resign: true },
      authority: { scopes: ["turns"], resource_types: ["*"] },
    },
  })});
  const data = await res.json();
  if (!res.ok) { log("join failed: " + JSON.stringify(data)); return; }
  clientId = data.client_id; sessionId = data.session_id; roomId = data.room_id || null;
  $("status").textContent = data.match_status === "queued"
    ? `Queued (position ${data.queue_position ?? "?"}) — waiting for an opponent…`
    : "Matched!";
  $("joinBtn").disabled = true; $("leaveBtn").disabled = false; $("rematchBtn").disabled = false;
  $("passBtn").disabled = false; $("resignBtn").disabled = false;
  log("joined: " + JSON.stringify(data));
  connectStream();
  if (data.match_status !== "queued") refreshTurnState();
}
async function refreshTurnState() {
  if (!clientId) return;
  try {
    const res = await api("/api/multiplayer/turn/state", { method: "GET" });
    const data = await res.json();
    if (data.turn_state) applyMp({ turnState: data.turn_state });
  } catch (e) { log("turn state fetch: " + e); }
}
function applyMp(mp) {
  if (!mp) return;
  if (mp.room && mp.room.roomId) roomId = mp.room.roomId;
  if (mp.match) {
    if (mp.match.roomId) roomId = mp.match.roomId;
    if (mp.match.status === "queued") {
      $("status").textContent = `Queued (position ${mp.match.queuePosition ?? "?"}) — waiting for an opponent…`;
      return;
    }
    if (mp.match.status === "matched" || mp.match.status === "ready") {
      $("status").textContent = "Matched!";
      if (!mp.turnState) { refreshTurnState(); return; }
    }
    if (mp.match.status === "finished" && !mp.turnState) {
      $("status").textContent = "Game over.";
      return;
    }
  }
  const ts = mp.turnState;
  if (!ts) return;
  turnOrder = ts.turn_order || [];
  const myIndex = turnOrder.indexOf(clientId);
  myMark = myIndex === 0 ? "X" : myIndex === 1 ? "O" : null;
  if (Array.isArray(ts.state?.board) && ts.state.board.length === 9) board = ts.state.board;
  $("you").textContent = myMark ? `You are ${myMark} · Seat ${myIndex} · Room ${roomId || ""}` : "";
  if (ts.phase === "finished") {
    $("status").textContent = ts.is_draw ? "Draw!" : (ts.winner_id === clientId ? "You win!" : ts.winner_id ? "You lose." : "Game over — " + (ts.end_reason || ""));
  } else if (ts.current_player_id === clientId) {
    $("status").textContent = `Your turn (${myMark}) — click an empty cell. Turn ${ts.turn_number}.`;
  } else {
    $("status").textContent = `Waiting for opponent… Turn ${ts.turn_number}.`;
  }
  render();
}
function handleStreamData(raw) {
  try {
    let text = String(raw || "").trim();
    if (text.startsWith("signals ")) text = text.slice("signals ".length);
    const data = JSON.parse(text);
    const signals = data.signals || data;
    const mp = signals.mp || (signals.match || signals.turnState ? signals : null);
    if (mp) applyMp(mp);
  } catch (e) { log("stream parse: " + e); }
}
function connectStream() {
  if (!sessionId) return;
  if (stream) stream.close();
  stream = new EventSource(`/api/multiplayer/stream?session_id=${encodeURIComponent(sessionId)}`);
  stream.addEventListener("datastar-patch-signals", (ev) => handleStreamData(ev.data));
  stream.onmessage = (ev) => handleStreamData(ev.data);
  stream.onerror = () => { log("stream error — reconnecting on next join"); };
}
async function makeMove(cell) {
  if (board[cell]) return;
  if (!myMark) { log("not matched yet"); return; }
  const next = [...board]; next[cell] = myMark;
  const w = winnerOf(next);
  const isDraw = !w && next.every(Boolean);
  const marks = {}; turnOrder.forEach((id, i) => marks[id] = i === 0 ? "X" : "O");
  const res = await api("/api/multiplayer/turn/action", { method: "POST", body: JSON.stringify({
    action_type: "move",
    payload: { cell, mark: myMark },
    proposed_state: { board: next, marks },
    claimed_winner_id: w ? clientId : null,
    claimed_is_draw: isDraw,
    claimed_end_reason: w ? "win" : isDraw ? "draw" : null,
  })});
  const data = await res.json();
  log("move -> " + JSON.stringify(data));
  if (data.accepted) { board = next; render(); }
  else $("status").textContent = "Move rejected: " + (data.reason || "unknown");
}
async function sendAction(action_type) {
  const res = await api("/api/multiplayer/turn/action", { method: "POST", body: JSON.stringify({ action_type, payload: {} }) });
  log(action_type + " -> " + JSON.stringify(await res.json()));
}
async function leave() {
  if (stream) { stream.close(); stream = null; }
  await api("/api/multiplayer/leave", { method: "POST", body: "{}" });
  clientId = sessionId = roomId = null; turnOrder = []; myMark = null; board = Array(9).fill("");
  $("status").textContent = "Left."; $("you").textContent = "";
  $("joinBtn").disabled = false; $("leaveBtn").disabled = true;
  $("passBtn").disabled = true; $("resignBtn").disabled = true; render();
}
$("joinBtn").onclick = join;
$("leaveBtn").onclick = leave;
$("rematchBtn").onclick = async () => { await leave(); await join(); };
$("passBtn").onclick = () => sendAction("pass");
$("resignBtn").onclick = () => sendAction("resign");
render();
</script>
</body>
</html>
